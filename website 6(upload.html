<html><head><base href="." />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TGS - Upload Chapter</title>
<style>
:root {
  --primary: #2196f3;
  --dark: #1a1a1a;
  --light: #f5f5f5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Roboto', sans-serif;
  background: var(--dark);
  color: var(--light);
}

.navbar {
  background: #000;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: var(--primary);
  font-size: 1.5rem;
  font-weight: bold;
}

.admin-container {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 1rem;
}

.admin-section {
  background: #222;
  border-radius: 8px;
  padding: 2rem;
  margin-bottom: 2rem;
}

h2 {
  margin-bottom: 1.5rem;
  color: var(--primary);
}

.form-group {
  margin-bottom: 1.5rem;
}

label {
  display: block;
  margin-bottom: 0.5rem;
}

input[type="text"],
input[type="number"],
textarea,
select {
  width: 100%;
  padding: 0.8rem;
  border-radius: 4px;
  border: 1px solid #444;
  background: #333;
  color: var(--light);
  margin-bottom: 0.5rem;
}

.file-upload {
  border: 2px dashed #444;
  padding: 2rem;
  text-align: center;
  border-radius: 8px;
  margin: 1rem 0;
  cursor: pointer;
}

.file-upload:hover {
  border-color: var(--primary);
}

.preview-images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1rem;
  margin: 1rem 0;
}

.preview-image {
  position: relative;
  aspect-ratio: 2/3;
  background: #333;
  border-radius: 4px;
  overflow: hidden;
}

.preview-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.remove-image {
  position: absolute;
  top: 5px;
  right: 5px;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  cursor: pointer;
}

.submit-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 1rem 2rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
}

.submit-btn:hover {
  background: #1976d2;
}
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">TGS Admin</div>
  </nav>

  <div class="admin-container">
    <div class="admin-section">
      <h2>Upload New Manga</h2>
      <form id="mangaForm">
        <div class="form-group">
          <label>Manga Title</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Author</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select required>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="hiatus">Hiatus</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cover Image</label>
          <div class="file-upload" id="coverUpload">
            <p>Drop cover image here or click to upload</p>
          </div>
        </div>
        <button type="submit" class="submit-btn">Create Manga</button>
      </form>
    </div>

    <div class="admin-section">
      <h2>Upload New Chapter</h2>
      <form id="chapterForm">
        <div class="form-group">
          <label>Select Manga</label>
          <select required>
            <option value="">Choose manga...</option>
            <option value="1">Thiên thần ăn bám</option>
          </select>
        </div>
        <div class="form-group">
          <label>Chapter Number</label>
          <input type="number" required>
        </div>
        <div class="form-group">
          <label>Chapter Title</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Chapter Pages</label>
          <div class="file-upload" id="pagesUpload">
            <p>Drop chapter pages here or click to upload</p>
          </div>
          <div class="preview-images" id="previewContainer"></div>
        </div>
        <button type="submit" class="submit-btn">Upload Chapter</button>
      </form>
    </div>
  </div>

<script>
function handleFileUpload(element, previewContainer) {
  element.addEventListener('dragover', (e) => {
    e.preventDefault();
    element.style.borderColor = 'var(--primary)';
  });

  element.addEventListener('dragleave', () => {
    element.style.borderColor = '#444';
  });

  element.addEventListener('drop', (e) => {
    e.preventDefault();
    element.style.borderColor = '#444';
    const files = e.dataTransfer.files;
    handleFiles(files, previewContainer);
  });

  element.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = 'image/*';
    input.onchange = (e) => handleFiles(e.target.files, previewContainer);
    input.click();
  });
}

function handleFiles(files, previewContainer) {
  if (!previewContainer) return;

  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const preview = document.createElement('div');
      preview.className = 'preview-image';
      preview.innerHTML = `
        <img src="${e.target.result}" alt="Preview">
        <button class="remove-image">&times;</button>
      `;
      
      preview.querySelector('.remove-image').onclick = () => {
        preview.remove();
      };

      previewContainer.appendChild(preview);
    };
    reader.readAsDataURL(file);
  });
}

handleFileUpload(document.getElementById('coverUpload'));
handleFileUpload(document.getElementById('pagesUpload'), document.getElementById('previewContainer'));

document.getElementById('mangaForm').onsubmit = (e) => {
  e.preventDefault();
  // Add manga upload logic here
  alert('Manga created successfully!');
};

document.getElementById('chapterForm').onsubmit = (e) => {
  e.preventDefault();
  // Add chapter upload logic here
  alert('Chapter uploaded successfully!');
};
</script>
</body></html>
