<html><head><base href="." />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TGS - New Forum Post</title>
<style>
:root {
  --primary: #2196f3;
  --dark: #1a1a1a;
  --light: #f5f5f5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Roboto', sans-serif;
  background: var(--dark);
  color: var(--light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.navbar {
  background: #000;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: var(--primary);
  font-size: 1.5rem;
  font-weight: bold;
}

.forum-container {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 1rem;
}

.post-form {
  background: #222;
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 2rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--light);
}

.form-input {
  width: 100%;
  background: #333;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 0.8rem;
  color: var(--light);
}

.form-textarea {
  min-height: 200px;
  resize: vertical;
}

.upload-area {
  border: 2px dashed #444;
  border-radius: 4px;
  padding: 2rem;
  text-align: center;
  margin-bottom: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.upload-area:hover {
  border-color: var(--primary);
  background: rgba(33, 150, 243, 0.1);
}

.upload-icon {
  color: #666;
  margin-bottom: 1rem;
}

.preview-area {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.preview-item {
  position: relative;
  aspect-ratio: 1;
  background: #333;
  border-radius: 4px;
  overflow: hidden;
}

.preview-remove {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  background: rgba(0, 0, 0, 0.5);
  border: none;
  color: white;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
}

.post-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
}

.btn {
  padding: 0.8rem 1.5rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-secondary {
  background: #444;
  color: white;
}
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">TGS</div>
  </nav>

  <div class="forum-container">
    <form class="post-form">
      <div class="form-group">
        <label class="form-label">Tiêu đề bài viết</label>
        <input type="text" class="form-input" placeholder="Nhập tiêu đề...">
      </div>

      <div class="form-group">
        <label class="form-label">Nội dung</label>
        <textarea class="form-input form-textarea" placeholder="Viết nội dung bài viết..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Ảnh đính kèm</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">
            <svg width="48" height="48" viewBox="0 0 24 24">
              <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
            </svg>
          </div>
          <p>Kéo thả hình ảnh vào đây hoặc click để chọn file</p>
          <input type="file" id="fileInput" multiple accept="image/*" style="display: none">
        </div>
        <div class="preview-area" id="previewArea"></div>
      </div>

      <div class="post-actions">
        <button type="button" class="btn btn-secondary">Hủy</button>
        <button type="submit" class="btn btn-primary">Đăng bài</button>
      </div>
    </form>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const previewArea = document.getElementById('previewArea');
  const form = document.querySelector('.post-form');

  uploadArea.addEventListener('click', () => {
    fileInput.click();
  });

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--primary)';
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.style.borderColor = '#444';
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#444';
    const files = e.dataTransfer.files;
    handleFiles(files);
  });

  fileInput.addEventListener('change', () => {
    handleFiles(fileInput.files);
  });

  function handleFiles(files) {
    [...files].forEach(file => {
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const preview = document.createElement('div');
          preview.className = 'preview-item';
          preview.innerHTML = `
            <img src="${e.target.result}" alt="Preview" style="width: 100%; height: 100%; object-fit: cover;">
            <button type="button" class="preview-remove">&times;</button>
          `;
          previewArea.appendChild(preview);

          preview.querySelector('.preview-remove').addEventListener('click', () => {
            preview.remove();
          });
        };
        reader.readAsDataURL(file);
      }
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // Handle form submission here
  });
});
</script>
</body></html>
